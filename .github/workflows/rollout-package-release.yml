name: Plan package release waves

on:
  repository_dispatch:
    types: [package-release]
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable coordinator run identifier; retries must reuse it.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-wave-plan-${{ inputs.run_id || github.event.client_payload.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.inventory.outputs.run_id }}
    steps:
      - name: Check out canonical Renovate policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Mint the organization Renovate Sync App read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          permission-contents: read
      - name: Enumerate selected repositories and verified package identities
        id: inventory
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DISPATCH_RUN_ID: ${{ github.event.client_payload.run_id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const runId = process.env.INPUT_RUN_ID || process.env.DISPATCH_RUN_ID || String(context.runId);
            if (!/^[A-Za-z0-9._-]+$/.test(runId)) throw new Error('Release-wave run ID is invalid.');
            const exclusions = JSON.parse(fs.readFileSync('release-wave-exclusions.json', 'utf8'));
            if (!exclusions?.repositories || typeof exclusions.repositories !== 'object' || Array.isArray(exclusions.repositories)) throw new Error('Release-wave exclusions must be an object keyed by repository.');
            const installationRepositories = await github.paginate(github.rest.apps.listReposAccessibleToInstallation, { per_page: 100 });
            const selected = installationRepositories.filter((repository) => repository.owner?.login === 'ankhorage').toSorted((left, right) => left.full_name.localeCompare(right.full_name));
            const readFile = async (repository, filePath) => {
              try {
                const [owner, repo] = repository.full_name.split('/');
                const { data } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: repository.default_branch });
                return Array.isArray(data) || data.type !== 'file' || !data.content ? undefined : Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            };
            const repositories = [];
            const publishedPackages = [];
            for (const repository of selected) {
              const manifestText = await readFile(repository, 'package.json');
              const workflow = await readFile(repository, '.github/workflows/renovate.yml');
              const manifest = manifestText === undefined ? {} : JSON.parse(manifestText);
              const packageName = typeof manifest.name === 'string' ? manifest.name : undefined;
              const packageVersion = typeof manifest.version === 'string' ? manifest.version : undefined;
              const publishable = packageName?.startsWith('@ankhorage/') === true && manifest.private !== true;
              repositories.push({
                archived: repository.archived === true,
                bootstrapReady: workflow?.includes("github.event.pull_request.user.login == 'ankhorage-renovate-sync[bot]'") === true,
                dependencies: { dependencies: manifest.dependencies ?? {}, devDependencies: manifest.devDependencies ?? {}, optionalDependencies: manifest.optionalDependencies ?? {}, peerDependencies: manifest.peerDependencies ?? {} },
                ...(typeof exclusions.repositories[repository.full_name] === 'string' ? { excludedReason: exclusions.repositories[repository.full_name] } : {}),
                fullName: repository.full_name,
                ...(packageName === undefined ? {} : { packageName }),
                ...(packageVersion === undefined ? {} : { packageVersion }),
                private: repository.private === true,
                publishable,
              });
              if (!publishable) continue;
              const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(packageName));
              if (!response.ok) continue;
              const metadata = await response.json();
              const latest = metadata?.['dist-tags']?.latest;
              const latestManifest = metadata?.versions?.[latest];
              if (latestManifest?.name !== packageName || latestManifest?.version !== latest || latest.includes('-')) continue;
              publishedPackages.push({ name: packageName, version: latest });
            }
            const inputPath = path.join(process.env.RUNNER_TEMP, 'release-wave-input.json');
            fs.writeFileSync(inputPath, JSON.stringify({ publishedPackages, repositories, runId }));
            core.setOutput('input_path', inputPath);
            core.setOutput('run_id', runId);
            core.notice('Selected App inventory: ' + selected.length + ' repositories; no repository outside this installation will be mutated.');
      - name: Compute deterministic release waves and checkpoint
        run: bun src/cli/commands/release/plan.ts "${{ steps.inventory.outputs.input_path }}" "$RUNNER_TEMP/release-wave-checkpoint.json"
      - name: Publish resumable audit checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-wave-${{ steps.inventory.outputs.run_id }}
          path: ${{ runner.temp }}/release-wave-checkpoint.json
          retention-days: 90
      - name: Report blocked and pending inventory entries
        run: |
          cat "$RUNNER_TEMP/release-wave-checkpoint.json"
          node -e "const checkpoint=require(process.env.RUNNER_TEMP + '/release-wave-checkpoint.json'); if (checkpoint.plan.blocked.length > 0) process.exit(1)"

  execute:
    needs: plan
    if: vars.ANKHORAGE_RELEASE_WAVES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicitly enabled future coordinator
        run: |
          echo "The coordinator execution phase is intentionally gated until independent review approves activation."
          exit 1
