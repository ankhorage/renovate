name: Synchronize Renovate Update

on:
  workflow_call:
    inputs:
      renovate_sync_client_id:
        required: true
        type: string
    secrets:
      renovate_sync_private_key:
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  DEVTOOLS_MANAGED_SKILL_NAMES: ankhorage-coding-rules,ankhorage-project-structure,zora-designer

jobs:
  prepare:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.metadata.outputs.base-sha }}
      bun-version: ${{ steps.metadata.outputs.bun-version }}
      head-ref: ${{ steps.metadata.outputs.head-ref }}
      head-sha: ${{ steps.metadata.outputs.head-sha }}
      sync-mode: ${{ steps.metadata.outputs.sync-mode }}
    steps:
      - name: Validate Renovate metadata
        id: metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber || context.actor !== 'renovate[bot]') {
              core.setFailed('This workflow only accepts Renovate pull requests.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (pull.head.repo?.full_name !== owner + '/' + repo || !pull.head.ref.startsWith('renovate/')) {
              core.setFailed('The Renovate branch must belong to the target repository.');
              return;
            }

            const readManifest = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'package.json',
                ref,
              });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                throw new Error('package.json is not a readable file.');
              }
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const base = await readManifest(pull.base.sha);
            const head = await readManifest(pull.head.sha);
            const packageManager = typeof base.packageManager === 'string'
              ? /^bun@(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(base.packageManager)
              : null;
            if (!packageManager) {
              throw new Error('The trusted base packageManager must pin an exact Bun version.');
            }

            const sections = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
            const toolchainNames = new Set(['@ankhorage/ankh', '@ankhorage/devtools']);
            const toolchainChanged = sections.some((section) =>
              [...toolchainNames].some((name) => base[section]?.[name] !== head[section]?.[name])
            );
            const isDevtoolsOwner = owner + '/' + repo === 'ankhorage/devtools';
            const ownerDependencyChanged = isDevtoolsOwner && sections.some((section) => {
              const names = new Set([
                ...Object.keys(base[section] ?? {}),
                ...Object.keys(head[section] ?? {}),
              ]);
              return [...names].some((name) => base[section]?.[name] !== head[section]?.[name]);
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const ownerPolicyChanged = isDevtoolsOwner && files.some(
              ({ filename }) => filename === 'src/policy/bunRuntimePolicy.ts',
            );
            const ownerUpdate =
              ownerDependencyChanged ||
              (isDevtoolsOwner && base.packageManager !== head.packageManager) ||
              ownerPolicyChanged;
            const syncMode = ownerUpdate
              ? 'devtools-owner'
              : toolchainChanged
                ? 'consumer'
                : 'none';

            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('bun-version', packageManager[1]);
            core.setOutput('head-ref', pull.head.ref);
            core.setOutput('head-sha', pull.head.sha);
            core.setOutput('sync-mode', syncMode);

      - name: Check out the Renovate commit without credentials
        if: steps.metadata.outputs.sync-mode != 'none'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.metadata.outputs.head-sha }}
          path: repository
          persist-credentials: false

      - name: Check out the trusted Devtools owner base without credentials
        if: steps.metadata.outputs.sync-mode == 'devtools-owner'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.metadata.outputs.base-sha }}
          path: trusted-owner
          persist-credentials: false

      - name: Resolve the exact selected toolchain
        if: steps.metadata.outputs.sync-mode == 'consumer'
        id: toolchain
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANONICAL_ANKH_VERSION: '0.4.0'
        with:
          script: |
            const fs = require('node:fs');
            const lock = fs.readFileSync('repository/bun.lock', 'utf8');
            const manifest = JSON.parse(fs.readFileSync('repository/package.json', 'utf8'));
            const sections = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
            const resolveVersion = (name, fallbackVersion) => {
              const declarations = sections
                .map((section) => manifest[section]?.[name])
                .filter((value) => typeof value === 'string');
              if (declarations.length === 0 && fallbackVersion) {
                // This immutable workflow owns the CLI version for Devtools-only consumers.
                if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(fallbackVersion)) {
                  throw new Error('The trusted workflow must pin an exact fallback ' + name + ' version.');
                }
                return fallbackVersion;
              }
              const escaped = name.replace(/[.*+?^$()|[\]\\]/g, '\\$&');
              const match = new RegExp(
                '^    "' + escaped + '": \\["' + escaped + '@([^"]+)"',
                'm',
              ).exec(lock);
              if (!match || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(match[1])) {
                throw new Error('bun.lock must select one exact root ' + name + ' version.');
              }
              const declared = declarations.length === 1
                ? /^[~^]?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(declarations[0])
                : null;
              if (!declared || declared[1] !== match[1]) {
                throw new Error(
                  'package.json and bun.lock must select the same exact root ' + name + ' version.',
                );
              }
              return match[1];
            };
            core.setOutput(
              'ankh-version',
              resolveVersion('@ankhorage/ankh', process.env.CANONICAL_ANKH_VERSION),
            );
            core.setOutput('devtools-version', resolveVersion('@ankhorage/devtools'));

      - name: Set up the trusted Bun runtime
        if: steps.metadata.outputs.sync-mode != 'none'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.metadata.outputs.bun-version }}

      - name: Install the exact released toolchain
        if: steps.metadata.outputs.sync-mode == 'consumer'
        env:
          ANKH_VERSION: ${{ steps.toolchain.outputs.ankh-version }}
          DEVTOOLS_VERSION: ${{ steps.toolchain.outputs.devtools-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          ANKH_VERSION="$ANKH_VERSION" DEVTOOLS_VERSION="$DEVTOOLS_VERSION" bun -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(
              process.env.RUNNER_TEMP + "/toolchain/package.json",
              JSON.stringify({
                private: true,
                dependencies: {
                  "@ankhorage/ankh": process.env.ANKH_VERSION,
                  "@ankhorage/devtools": process.env.DEVTOOLS_VERSION,
                },
              }, null, 2) + "\n",
            );
          '
          bun install \
            --cwd "$RUNNER_TEMP/toolchain" \
            --ignore-scripts \
            --registry=https://registry.npmjs.org

      - name: Install the trusted Devtools owner base
        if: steps.metadata.outputs.sync-mode == 'devtools-owner'
        run: bun install --cwd trusted-owner --frozen-lockfile --ignore-scripts

      - name: Synchronize the consumer and prove byte stability
        if: steps.metadata.outputs.sync-mode == 'consumer'
        run: |
          mkdir -p "$RUNNER_TEMP/safe-bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'if [ "$1" = "install" ]; then' \
            '  shift' \
            '  exec "$SAFE_REAL_BUN" install --ignore-scripts --lockfile-only --registry=https://registry.npmjs.org "$@"' \
            'fi' \
            'exec "$SAFE_REAL_BUN" "$@"' \
            > "$RUNNER_TEMP/safe-bin/bun"
          chmod +x "$RUNNER_TEMP/safe-bin/bun"
          ln -s "$RUNNER_TEMP/toolchain/node_modules" repository/node_modules
          export SAFE_REAL_BUN
          SAFE_REAL_BUN="$(command -v bun)"
          export PATH="$RUNNER_TEMP/safe-bin:$PATH"
          cd repository
          "$RUNNER_TEMP/toolchain/node_modules/.bin/ankh" devtools sync .
          rm node_modules
          git add -N -f -- .
          first_hash="$(git diff --binary | shasum -a 256)"
          ln -s "$RUNNER_TEMP/toolchain/node_modules" node_modules
          "$RUNNER_TEMP/toolchain/node_modules/.bin/ankh" devtools sync .
          "$RUNNER_TEMP/toolchain/node_modules/.bin/ankh" devtools status .
          rm node_modules
          git add -N -f -- .
          second_hash="$(git diff --binary | shasum -a 256)"
          test "$first_hash" = "$second_hash"

      - name: Synchronize the Devtools owner and prove byte stability
        if: steps.metadata.outputs.sync-mode == 'devtools-owner'
        run: |
          managed_paths=(
            .github/workflows/ci.yml
            .github/workflows/release.yml
            .github/workflows/renovate.yml
            README.md
            bun.lock
            package.json
          )
          bun trusted-owner/scripts/sync-renovate-owner.ts sync repository
          git -C repository add -N -f -- "${managed_paths[@]}"
          first_hash="$(git -C repository diff --binary | shasum -a 256)"
          bun trusted-owner/scripts/sync-renovate-owner.ts sync repository
          bun trusted-owner/scripts/sync-renovate-owner.ts status repository
          git -C repository add -N -f -- "${managed_paths[@]}"
          second_hash="$(git -C repository diff --binary | shasum -a 256)"
          test "$first_hash" = "$second_hash"

      - name: Package deterministic managed changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BASE_SHA: ${{ steps.metadata.outputs.base-sha }}
          HEAD_REF: ${{ steps.metadata.outputs.head-ref }}
          HEAD_SHA: ${{ steps.metadata.outputs.head-sha }}
          SYNC_MODE: ${{ steps.metadata.outputs.sync-mode }}
        with:
          script: |
            const childProcess = require('node:child_process');
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const consumerAllowed = [
              '.agents/.devtools-manifest.json',
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
              '.github/workflows/renovate.yml',
              '.prettierrc.js',
              '.vscode/extensions.json',
              '.vscode/settings.json',
              'AGENTS.md',
              'bun.lock',
              'eslint.config.mjs',
              'eslint.local.config.mjs',
              'knip.config.ts',
              'package.json',
              'prettier.local.config.js',
            ];
            const ownerAllowed = [
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
              '.github/workflows/renovate.yml',
              'README.md',
              'bun.lock',
              'package.json',
            ];
            const allowedByMode = {
              consumer: new Set(consumerAllowed),
              'devtools-owner': new Set(ownerAllowed),
              none: new Set(),
            };
            const syncMode = process.env.SYNC_MODE;
            const allowed = allowedByMode[syncMode];
            if (!allowed) throw new Error('The prepared sync mode is invalid.');
            const managedManifestPath = '.agents/.devtools-manifest.json';
            const managedSkillRoots = process.env.DEVTOOLS_MANAGED_SKILL_NAMES
              .split(',')
              .map((name) => '.agents/skills/' + name + '/');
            const isExactManagedSkillPath = (relativePath) => {
              const managedSkillRoot = managedSkillRoots.find((root) => relativePath.startsWith(root));
              if (managedSkillRoot === undefined) return false;
              const segments = relativePath.slice(managedSkillRoot.length).split('/');
              return segments.every((segment) => segment !== '' && segment !== '.' && segment !== '..');
            };
            const readManagedSkillFiles = (contents) => {
              const manifest = JSON.parse(contents);
              if (
                manifest?.schemaVersion !== 1 ||
                typeof manifest.sourceDevtoolsVersion !== 'string' ||
                !manifest.skills ||
                typeof manifest.skills !== 'object' ||
                Array.isArray(manifest.skills)
              ) {
                throw new Error('Devtools managed-skill manifest is invalid.');
              }
              const declaredFiles = new Map();
              for (const [skillName, entry] of Object.entries(manifest.skills)) {
                if (
                  !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(skillName) ||
                  !entry ||
                  typeof entry !== 'object' ||
                  Array.isArray(entry) ||
                  !entry.files ||
                  typeof entry.files !== 'object' ||
                  Array.isArray(entry.files)
                ) {
                  throw new Error('Devtools managed-skill entry is invalid: ' + skillName);
                }
                const expectedRoot = '.agents/skills/' + skillName + '/';
                for (const [relativePath, hash] of Object.entries(entry.files)) {
                  if (
                    !relativePath.startsWith(expectedRoot) ||
                    !isExactManagedSkillPath(relativePath) ||
                    typeof hash !== 'string' ||
                    !/^sha256:[a-f0-9]{64}$/.test(hash) ||
                    declaredFiles.has(relativePath)
                  ) {
                    throw new Error('Devtools managed-skill file is invalid: ' + relativePath);
                  }
                  declaredFiles.set(relativePath, hash);
                }
              }
              return declaredFiles;
            };
            const readRepositoryFile = async (relativePath, ref) => {
              try {
                const { owner, repo } = context.repo;
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: relativePath,
                  ref,
                });
                if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                  throw new Error('Repository file is not readable: ' + relativePath);
                }
                return Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const root = path.resolve('repository');
            const declaredManagedSkillFiles = new Map();
            const baseManagedSkillFiles = new Map();
            if (syncMode === 'consumer') {
              const managedManifestFile = path.join(root, managedManifestPath);
              if (!fs.lstatSync(managedManifestFile).isFile()) {
                throw new Error('Devtools ownership manifest must be a regular file.');
              }
              const managedManifest = fs.readFileSync(managedManifestFile, 'utf8');
              for (const [relativePath, hash] of readManagedSkillFiles(managedManifest)) {
                declaredManagedSkillFiles.set(relativePath, hash);
              }
              const baseManagedManifest = await readRepositoryFile(
                managedManifestPath,
                process.env.BASE_SHA,
              );
              if (baseManagedManifest !== null) {
                for (const [relativePath, hash] of readManagedSkillFiles(baseManagedManifest)) {
                  baseManagedSkillFiles.set(relativePath, hash);
                }
              }
            }
            const isManagedSkillPath = (relativePath) =>
              isExactManagedSkillPath(relativePath) && declaredManagedSkillFiles.has(relativePath);
            const isManagedSkillDeletion = (relativePath) =>
              isExactManagedSkillPath(relativePath) && baseManagedSkillFiles.has(relativePath);
            const isAllowed = (relativePath) =>
              allowed.has(relativePath) ||
              (syncMode === 'consumer' && isManagedSkillPath(relativePath));
            const isDeletionAllowed = (relativePath) =>
              syncMode === 'consumer' && isManagedSkillDeletion(relativePath);
            const files = [];
            const deletions = [];
            if (syncMode !== 'none') {
              const output = childProcess.execFileSync(
                'git',
                ['-C', root, 'diff', '--name-only', '--diff-filter=ACMRTUXB', '-z'],
              ).toString('utf8');
              const deleted = childProcess.execFileSync(
                'git',
                ['-C', root, 'diff', '--name-only', '--diff-filter=D', '-z'],
              ).toString('utf8');
              const untracked = [
                childProcess.execFileSync(
                  'git',
                  ['-C', root, 'ls-files', '--others', '--exclude-standard', '-z'],
                ),
                childProcess.execFileSync(
                  'git',
                  ['-C', root, 'ls-files', '--others', '--ignored', '--exclude-standard', '-z'],
                ),
              ].map((value) => value.toString('utf8')).join('');
              for (const relativePath of untracked.split('\0').filter(Boolean)) {
                if (!isAllowed(relativePath)) {
                  throw new Error('Devtools sync created an unexpected path: ' + relativePath);
                }
              }
              for (const relativePath of output.split('\0').filter(Boolean)) {
                if (!isAllowed(relativePath)) {
                  throw new Error('Devtools sync changed an unexpected path: ' + relativePath);
                }
                const absolutePath = path.join(root, relativePath);
                if (!fs.lstatSync(absolutePath).isFile()) {
                  throw new Error('Managed output must be a regular file: ' + relativePath);
                }
                if (isManagedSkillPath(relativePath)) {
                  const expectedManagedHash = declaredManagedSkillFiles.get(relativePath);
                  const actualManagedHash =
                    'sha256:' + crypto.createHash('sha256').update(fs.readFileSync(absolutePath)).digest('hex');
                  if (expectedManagedHash !== actualManagedHash) {
                    throw new Error('Managed skill content does not match its ownership manifest: ' + relativePath);
                  }
                }
                files.push({
                  path: relativePath,
                  content: fs.readFileSync(absolutePath).toString('base64'),
                });
              }
              for (const relativePath of deleted.split('\0').filter(Boolean)) {
                if (!isDeletionAllowed(relativePath)) {
                  throw new Error('Devtools sync deleted an unexpected path: ' + relativePath);
                }
                deletions.push(relativePath);
              }
            }
            const artifactPath = path.join(process.env.RUNNER_TEMP, 'renovate-managed.json');
            fs.writeFileSync(artifactPath, JSON.stringify({
              headRef: process.env.HEAD_REF,
              headSha: process.env.HEAD_SHA,
              syncMode,
              files,
              deletions,
            }));

      - name: Upload deterministic managed changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renovate-managed
          path: ${{ runner.temp }}/renovate-managed.json
          retention-days: 1

  commit:
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Download deterministic managed changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: renovate-managed
          path: ${{ runner.temp }}/renovate-managed

      - name: Create repository-scoped Renovate synchronization token
        id: renovate-sync-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.renovate_sync_client_id }}
          private-key: ${{ secrets.renovate_sync_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - name: Commit managed changes and trigger pull request CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/renovate-managed/renovate-managed.json
        with:
          github-token: ${{ steps.renovate-sync-token.outputs.token }}
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber || context.actor !== 'renovate[bot]') {
              core.setFailed('This workflow only accepts Renovate pull requests.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const artifact = JSON.parse(fs.readFileSync(process.env.ARTIFACT_PATH, 'utf8'));
            if (
              pull.head.repo?.full_name !== owner + '/' + repo ||
              !pull.head.ref.startsWith('renovate/') ||
              artifact.headRef !== pull.head.ref ||
              artifact.headSha !== pull.head.sha
            ) {
              throw new Error('The Renovate branch changed after managed output was prepared.');
            }

            const isDevtoolsOwner = owner + '/' + repo === 'ankhorage/devtools';
            const consumerAllowed = [
              '.agents/.devtools-manifest.json',
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
              '.github/workflows/renovate.yml',
              '.prettierrc.js',
              '.vscode/extensions.json',
              '.vscode/settings.json',
              'AGENTS.md',
              'bun.lock',
              'eslint.config.mjs',
              'eslint.local.config.mjs',
              'knip.config.ts',
              'package.json',
              'prettier.local.config.js',
            ];
            const ownerAllowed = [
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
              '.github/workflows/renovate.yml',
              'README.md',
              'bun.lock',
              'package.json',
            ];
            const allowedByMode = {
              consumer: new Set(consumerAllowed),
              'devtools-owner': new Set(ownerAllowed),
              none: new Set(),
            };
            const allowed = allowedByMode[artifact.syncMode];
            if (!allowed || (artifact.syncMode === 'devtools-owner' && !isDevtoolsOwner)) {
              throw new Error('Managed artifact contains an invalid sync mode.');
            }
            if (!Array.isArray(artifact.files)) throw new Error('Managed artifact files are invalid.');
            if (!Array.isArray(artifact.deletions)) {
              throw new Error('Managed artifact deletions are invalid.');
            }
            if (artifact.files.length > 256 || artifact.deletions.length > 256) {
              throw new Error('Managed artifact exceeds the file-count limit.');
            }
            const managedManifestPath = '.agents/.devtools-manifest.json';
            const managedSkillRoots = process.env.DEVTOOLS_MANAGED_SKILL_NAMES
              .split(',')
              .map((name) => '.agents/skills/' + name + '/');
            const isExactManagedSkillPath = (relativePath) => {
              const managedSkillRoot = managedSkillRoots.find((root) => relativePath.startsWith(root));
              if (managedSkillRoot === undefined) return false;
              const segments = relativePath.slice(managedSkillRoot.length).split('/');
              return segments.every((segment) => segment !== '' && segment !== '.' && segment !== '..');
            };
            const readManagedSkillFiles = (contents) => {
              const manifest = JSON.parse(contents);
              if (
                manifest?.schemaVersion !== 1 ||
                typeof manifest.sourceDevtoolsVersion !== 'string' ||
                !manifest.skills ||
                typeof manifest.skills !== 'object' ||
                Array.isArray(manifest.skills)
              ) {
                throw new Error('Devtools managed-skill manifest is invalid.');
              }
              const declaredFiles = new Map();
              for (const [skillName, entry] of Object.entries(manifest.skills)) {
                if (
                  !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(skillName) ||
                  !entry ||
                  typeof entry !== 'object' ||
                  Array.isArray(entry) ||
                  !entry.files ||
                  typeof entry.files !== 'object' ||
                  Array.isArray(entry.files)
                ) {
                  throw new Error('Devtools managed-skill entry is invalid: ' + skillName);
                }
                const expectedRoot = '.agents/skills/' + skillName + '/';
                for (const [relativePath, hash] of Object.entries(entry.files)) {
                  if (
                    !relativePath.startsWith(expectedRoot) ||
                    !isExactManagedSkillPath(relativePath) ||
                    typeof hash !== 'string' ||
                    !/^sha256:[a-f0-9]{64}$/.test(hash) ||
                    declaredFiles.has(relativePath)
                  ) {
                    throw new Error('Devtools managed-skill file is invalid: ' + relativePath);
                  }
                  declaredFiles.set(relativePath, hash);
                }
              }
              return declaredFiles;
            };
            const readRepositoryFile = async (relativePath, ref) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: relativePath,
                  ref,
                });
                if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                  throw new Error('Repository file is not readable: ' + relativePath);
                }
                return Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const declaredManagedSkillFiles = new Map();
            const baseManagedSkillFiles = new Map();
            if (artifact.syncMode === 'consumer') {
              const artifactManagedManifest = artifact.files.find(
                (file) => file?.path === managedManifestPath && typeof file.content === 'string',
              );
              const headManagedManifest = artifactManagedManifest
                ? Buffer.from(artifactManagedManifest.content, 'base64').toString('utf8')
                : await readRepositoryFile(managedManifestPath, pull.head.sha);
              if (headManagedManifest === null) {
                throw new Error('Consumer synchronization requires a Devtools ownership manifest.');
              }
              for (const [relativePath, hash] of readManagedSkillFiles(headManagedManifest)) {
                declaredManagedSkillFiles.set(relativePath, hash);
              }
              const baseManagedManifest = await readRepositoryFile(
                managedManifestPath,
                pull.base.sha,
              );
              if (baseManagedManifest !== null) {
                for (const [relativePath, hash] of readManagedSkillFiles(baseManagedManifest)) {
                  baseManagedSkillFiles.set(relativePath, hash);
                }
              }
            }
            const isManagedSkillPath = (relativePath) =>
              isExactManagedSkillPath(relativePath) && declaredManagedSkillFiles.has(relativePath);
            const isManagedSkillDeletion = (relativePath) =>
              isExactManagedSkillPath(relativePath) && baseManagedSkillFiles.has(relativePath);
            const isAllowed = (relativePath) =>
              allowed.has(relativePath) ||
              (artifact.syncMode === 'consumer' && isManagedSkillPath(relativePath));
            const isDeletionAllowed = (relativePath) =>
              artifact.syncMode === 'consumer' && isManagedSkillDeletion(relativePath);
            const managedFiles = new Map();
            for (const file of artifact.files) {
              if (
                !file ||
                typeof file.path !== 'string' ||
                !isAllowed(file.path) ||
                typeof file.content !== 'string' ||
                managedFiles.has(file.path)
              ) {
                throw new Error('Managed artifact contains an invalid file.');
              }
              const content = Buffer.from(file.content, 'base64');
              if (content.byteLength > 2_000_000) {
                throw new Error('Managed artifact file exceeds the size limit: ' + file.path);
              }
              if (isManagedSkillPath(file.path)) {
                const expectedManagedHash = declaredManagedSkillFiles.get(file.path);
                const actualManagedHash =
                  'sha256:' + crypto.createHash('sha256').update(content).digest('hex');
                if (expectedManagedHash !== actualManagedHash) {
                  throw new Error('Managed skill content does not match its ownership manifest: ' + file.path);
                }
              }
              managedFiles.set(file.path, content);
            }
            const managedDeletions = new Set();
            for (const relativePath of artifact.deletions) {
              if (
                typeof relativePath !== 'string' ||
                !isDeletionAllowed(relativePath) ||
                managedFiles.has(relativePath) ||
                managedDeletions.has(relativePath)
              ) {
                throw new Error('Managed artifact contains an invalid deletion.');
              }
              managedDeletions.add(relativePath);
            }

            const readManifest = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'package.json',
                ref,
              });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                throw new Error('package.json is not a readable file.');
              }
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const base = await readManifest(pull.base.sha);
            const head = await readManifest(pull.head.sha);
            const releaseSections = ['dependencies', 'optionalDependencies', 'peerDependencies'];
            const allSections = [...releaseSections, 'devDependencies'];
            const toolchainNames = new Set(['@ankhorage/ankh', '@ankhorage/devtools']);
            const toolchainChanged = allSections.some((section) =>
              [...toolchainNames].some((name) => base[section]?.[name] !== head[section]?.[name])
            );
            const ownerDependencyChanged = isDevtoolsOwner && allSections.some((section) => {
              const names = new Set([
                ...Object.keys(base[section] ?? {}),
                ...Object.keys(head[section] ?? {}),
              ]);
              return [...names].some((name) => base[section]?.[name] !== head[section]?.[name]);
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const ownerPolicyChanged = isDevtoolsOwner && files.some(
              ({ filename }) => filename === 'src/policy/bunRuntimePolicy.ts',
            );
            const ownerUpdate =
              ownerDependencyChanged ||
              (isDevtoolsOwner && base.packageManager !== head.packageManager) ||
              ownerPolicyChanged;
            const expectedSyncMode = ownerUpdate
              ? 'devtools-owner'
              : toolchainChanged
                ? 'consumer'
                : 'none';
            if (artifact.syncMode !== expectedSyncMode) {
              throw new Error('Managed artifact sync mode no longer matches the pull request.');
            }

            const effectiveHead = managedFiles.has('package.json')
              ? JSON.parse(managedFiles.get('package.json').toString('utf8'))
              : head;
            const changed = allSections.flatMap((section) => {
              const names = new Set([
                ...Object.keys(base[section] ?? {}),
                ...Object.keys(effectiveHead[section] ?? {}),
              ]);
              return [...names]
                .filter((name) =>
                  (isDevtoolsOwner || name.startsWith('@ankhorage/')) &&
                  base[section]?.[name] !== effectiveHead[section]?.[name]
                )
                .map((name) => ({ name, section }));
            });
            if (isDevtoolsOwner && base.packageManager !== effectiveHead.packageManager) {
              changed.push({ name: 'bun', section: 'packageManager' });
            }

            if (changed.length > 0) {
              const release =
                !effectiveHead.private &&
                typeof effectiveHead.name === 'string' &&
                (isDevtoolsOwner ||
                  changed.some(({ section }) => releaseSections.includes(section)));
              const frontmatter = release
                ? '---\n' + "'" + effectiveHead.name + "': patch\n---"
                : '---\n---';
              const tick = String.fromCharCode(96);
              const names = [...new Set(changed.map(({ name }) => tick + name + tick))]
                .sort()
                .join(', ');
              const subject = isDevtoolsOwner
                ? 'Update Devtools-owned dependencies: '
                : 'Update Ankhorage dependencies: ';
              const content = frontmatter + '\n\n' + subject + names + '.\n';
              const changesetPath = '.changeset/renovate-' + pullNumber + '.md';
              let currentContent = null;
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: changesetPath,
                  ref: pull.head.sha,
                });
                if (
                  !Array.isArray(response.data) &&
                  response.data.type === 'file' &&
                  response.data.content
                ) {
                  currentContent = Buffer.from(response.data.content, 'base64').toString('utf8');
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (currentContent !== content) {
                managedFiles.set(changesetPath, Buffer.from(content));
              }
            }

            if (managedFiles.size === 0 && managedDeletions.size === 0) {
              core.info('No managed synchronization or Changeset update is required.');
              return;
            }

            const treeEntries = [];
            for (const [path, content] of managedFiles) {
              const { data: blob } = await github.rest.git.createBlob({
                owner,
                repo,
                content: content.toString('base64'),
                encoding: 'base64',
              });
              treeEntries.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: blob.sha,
              });
            }
            for (const path of managedDeletions) {
              treeEntries.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: null,
              });
            }
            const { data: headCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: pull.head.sha,
            });
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headCommit.tree.sha,
              tree: treeEntries,
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: artifact.files.length > 0 || artifact.deletions.length > 0
                ? 'chore: synchronize Devtools-managed repository state'
                : 'chore: add changeset for dependency updates',
              tree: tree.sha,
              parents: [pull.head.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/' + pull.head.ref,
              sha: commit.sha,
              force: false,
            });
