name: Roll out Devtools release

on:
  repository_dispatch:
    types:
      - devtools-release
  workflow_dispatch:
    inputs:
      version:
        description: Exact published @ankhorage/devtools version to roll out
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devtools-release-rollout
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      has-repositories: ${{ steps.registry.outputs.has-repositories }}
      repositories: ${{ steps.registry.outputs.repositories }}
      required-protocol: ${{ steps.registry.outputs.required-protocol }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - name: Check out trusted rollout registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Mint the organization Renovate Sync App read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          permission-contents: read

      - name: Validate release and ready consumer registry
        id: registry
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const version = process.env.INPUT_VERSION || process.env.DISPATCH_VERSION;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version ?? '')) {
              throw new Error('Devtools rollout requires one exact published semver version.');
            }

            const protocolManifest = JSON.parse(fs.readFileSync('sync-protocol.json', 'utf8'));
            const canonicalProtocol = protocolManifest?.version;
            if (!Number.isInteger(canonicalProtocol) || canonicalProtocol < 1) {
              throw new Error('The canonical Renovate sync protocol must be a positive integer.');
            }

            const releaseResponse = await fetch(
              'https://registry.npmjs.org/%40ankhorage%2Fdevtools/' + encodeURIComponent(version),
              { headers: { accept: 'application/json' } },
            );
            if (!releaseResponse.ok) {
              throw new Error('The exact published Devtools release manifest could not be loaded.');
            }
            const releaseManifest = await releaseResponse.json();
            const requiredProtocol = releaseManifest?.ankhorage?.renovateSyncProtocol;
            if (!Number.isInteger(requiredProtocol) || requiredProtocol < 1) {
              throw new Error(
                'The published Devtools release must declare ankhorage.renovateSyncProtocol as a positive integer.',
              );
            }
            if (canonicalProtocol < requiredProtocol) {
              throw new Error(
                'The canonical Renovate sync protocol cannot satisfy this Devtools release.',
              );
            }

            const registry = JSON.parse(fs.readFileSync('devtools-consumers.json', 'utf8'));
            if (!Array.isArray(registry.repositories) || registry.repositories.length === 0) {
              throw new Error('The Devtools consumer registry must contain repositories.');
            }
            const uniqueRepositories = new Set(registry.repositories);
            if (uniqueRepositories.size !== registry.repositories.length) {
              throw new Error('The Devtools consumer registry must not contain duplicates.');
            }
            for (const repository of registry.repositories) {
              if (typeof repository !== 'string' || !/^ankhorage\/[a-z0-9-]+$/.test(repository)) {
                throw new Error('The Devtools consumer registry contains an invalid repository.');
              }
            }

            const installationRepositories = await github.paginate(
              github.rest.apps.listReposAccessibleToInstallation,
              { per_page: 100 },
            );
            const accessibleRepositories = new Set(
              installationRepositories.map((repository) => repository.full_name),
            );
            const inaccessibleRepositories = registry.repositories.filter(
              (repository) => !accessibleRepositories.has(repository),
            );
            if (inaccessibleRepositories.length > 0) {
              throw new Error(
                'The ankhorage-renovate-sync GitHub App installation does not include registered Devtools consumers: ' +
                  inaccessibleRepositories.join(', ') +
                  '. Add these repositories to the selected-repository App installation before treating them as managed-release ready. Bootstrap policy: https://github.com/ankhorage/renovate/issues/115',
              );
            }

            const readyRepositories = [];
            const waitingRepositories = [];
            for (const repository of registry.repositories) {
              const [owner, repo] = repository.split('/');
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/workflows/renovate.yml',
                });
                if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                  throw new Error('The managed Renovate workflow is not a readable file.');
                }
                const workflow = Buffer.from(data.content, 'base64').toString('utf8');
                if (
                  !workflow.includes(
                    "github.event.pull_request.user.login == 'ankhorage-renovate-sync[bot]'",
                  )
                ) {
                  waitingRepositories.push(repository);
                  continue;
                }
                readyRepositories.push(repository);
              } catch (error) {
                core.warning('Skipping ' + repository + ': ' + error.message);
                waitingRepositories.push(repository);
              }
            }

            core.notice(
              'Ready for protocol-gated rollout: ' + readyRepositories.length +
                '; awaiting the one-time workflow bootstrap: ' + waitingRepositories.length + '.',
            );
            core.setOutput('has-repositories', String(readyRepositories.length > 0));
            core.setOutput('repositories', JSON.stringify(readyRepositories));
            core.setOutput('required-protocol', String(requiredProtocol));
            core.setOutput('version', version);

  rollout:
    needs: validate
    if: needs.validate.outputs.has-repositories == 'true'
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.validate.outputs.repositories) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the canonical Renovate policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the pinned Renovate runner
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mint the organization Renovate Sync App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check pinned Renovate sync protocol
        id: protocol
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUIRED_PROTOCOL: ${{ needs.validate.outputs.required-protocol }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const requiredProtocol = Number(process.env.REQUIRED_PROTOCOL);
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/workflows/renovate.yml',
            });
            if (Array.isArray(data) || data.type !== 'file' || !data.content) {
              throw new Error('The managed Renovate workflow is not a readable file.');
            }
            const workflow = Buffer.from(data.content, 'base64').toString('utf8');
            const pin = /changeset\.yml@([0-9a-f]{40})/.exec(workflow)?.[1];
            if (!pin) {
              throw new Error('The managed Renovate workflow must pin changeset.yml by commit SHA.');
            }

            let protocol = 0;
            try {
              const response = await github.rest.repos.getContent({
                owner: 'ankhorage',
                repo: 'renovate',
                path: 'sync-protocol.json',
                ref: pin,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) {
                throw new Error('The pinned Renovate sync protocol is not a readable file.');
              }
              const manifest = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
              protocol = manifest?.version;
              if (!Number.isInteger(protocol) || protocol < 1) {
                throw new Error('The pinned Renovate sync protocol must be a positive integer.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const compatible = protocol >= requiredProtocol;
            core.notice(
              process.env.TARGET_REPOSITORY + ' pins Renovate protocol ' + protocol +
                '; Devtools requires ' + requiredProtocol + '.',
            );
            core.setOutput('compatible', String(compatible));

      - name: Update the immutable Renovate workflow first
        if: steps.protocol.outputs.compatible != 'true'
        env:
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PACKAGE_RULES: >-
            [{"matchDatasources":["github-digest"],"matchPackageNames":["ankhorage/renovate"],"enabled":true,"recreateWhen":"always"}]
          RENOVATE_PLATFORM: github
          RENOVATE_PR_HOURLY_LIMIT: '0'
          RENOVATE_REPOSITORIES: ${{ matrix.repository }}
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun x renovate --enabled-managers=custom.regex

      - name: Wait for this repository's compatible immutable Renovate workflow
        if: steps.protocol.outputs.compatible != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUIRED_PROTOCOL: ${{ needs.validate.outputs.required-protocol }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const requiredProtocol = Number(process.env.REQUIRED_PROTOCOL);
            const repository = process.env.TARGET_REPOSITORY;
            const [owner, repo] = repository.split('/');
            const timeoutAt = Date.now() + 20 * 60 * 1000;
            let lastPin;
            let lastProtocol = 0;

            while (Date.now() < timeoutAt) {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/workflows/renovate.yml',
              });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                throw new Error('The managed Renovate workflow is not a readable file: ' + repository);
              }
              const workflow = Buffer.from(data.content, 'base64').toString('utf8');
              const pin = /changeset\.yml@([0-9a-f]{40})/.exec(workflow)?.[1];
              if (!pin) {
                throw new Error(
                  'The managed Renovate workflow must pin changeset.yml by commit SHA: ' + repository,
                );
              }

              if (pin !== lastPin) {
                lastPin = pin;
                lastProtocol = 0;
                try {
                  const response = await github.rest.repos.getContent({
                    owner: 'ankhorage',
                    repo: 'renovate',
                    path: 'sync-protocol.json',
                    ref: pin,
                  });
                  if (
                    Array.isArray(response.data) ||
                    response.data.type !== 'file' ||
                    !response.data.content
                  ) {
                    throw new Error('The pinned Renovate sync protocol is not a readable file.');
                  }
                  const manifest = JSON.parse(
                    Buffer.from(response.data.content, 'base64').toString('utf8'),
                  );
                  lastProtocol = manifest?.version;
                  if (!Number.isInteger(lastProtocol) || lastProtocol < 1) {
                    throw new Error('The pinned Renovate sync protocol must be a positive integer.');
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              if (lastProtocol >= requiredProtocol) {
                core.notice(
                  repository + ' now pins compatible Renovate protocol ' + lastProtocol + '.',
                );
                return;
              }

              core.info(
                'Awaiting compatible Renovate workflow pin for ' + repository +
                  '; current protocol ' + lastProtocol + ', required ' + requiredProtocol + '.',
              );
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            throw new Error(
              'Timed out waiting for a compatible immutable Renovate workflow: ' + repository,
            );

      - name: Run Renovate immediately for the released Devtools version
        env:
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM: github
          RENOVATE_PACKAGE_RULES: >-
            [{"matchPackageNames":["@ankhorage/devtools"],"enabled":true,"rangeStrategy":"bump","allowedVersions":"${{ needs.validate.outputs.version }}","recreateWhen":"always"}]
          RENOVATE_PR_HOURLY_LIMIT: '0'
          RENOVATE_REPOSITORIES: ${{ matrix.repository }}
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          ROLLOUT_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "Rolling out exactly @ankhorage/devtools@$ROLLOUT_VERSION to $RENOVATE_REPOSITORIES"
          bun x renovate
