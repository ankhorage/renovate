name: Issue 112 finalize

on:
  push:
    branches:
      - fix/112-automatic-package-propagation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Add regression coverage and documentation source
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('src/default.test.ts')
          test_text = test_path.read_text()
          marker = "  test('keeps ordinary Ankhorage packages eligible', () => {\n"
          insertion = """  test('owns the managers required for package and workflow propagation', () => {\n    expect(consumerPreset.enabledManagers).toEqual(['npm', 'custom.regex']);\n  });\n\n"""
          if insertion not in test_text:
              if marker not in test_text:
                  raise SystemExit('default.test.ts insertion marker not found')
              test_text = test_text.replace(marker, insertion + marker, 1)
              test_path.write_text(test_text)

          example_path = Path('examples/renovate.json5')
          example_text = example_path.read_text()
          old = """ * immediately starts the same Renovate update flow for every repository in the reviewed consumer\n * registry; Renovate remains the only dependency-branch writer. The shared preset also performs a\n"""
          new = """ * immediately starts the same Renovate update flow for every repository in the reviewed consumer\n * registry. The preset explicitly owns npm and custom.regex extraction so self-hosted manager\n * filtering cannot silently drop package propagation. Never edit renovate/* branches manually;\n * request Renovate rebase/retry to discard edits and return the branch to Renovate ownership.\n * Renovate remains the only dependency-branch writer. The shared preset also performs a\n"""
          if new not in example_text:
              if old not in example_text:
                  raise SystemExit('examples/renovate.json5 insertion marker not found')
              example_path.write_text(example_text.replace(old, new, 1))

          changeset = Path('.changeset/own-renovate-managers.md')
          changeset.write_text("""---\n'@ankhorage/renovate': patch\n---\n\nExplicitly enable npm and custom regex managers in the canonical consumer preset so self-hosted Renovate configuration cannot silently disable Ankhorage package propagation.\n""")
          PY
      - name: Format and generate documentation
        run: |
          bun run format
          bun run docs
          bun run format
      - name: Commit validated implementation snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore automatic Ankhorage package propagation'
      - name: Validate repository
        run: |
          bun run build
          bun run test
          bun run typecheck
          bun run lint
          bun run knip:check
          bun run format:check
          bun run changeset:status
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/issue-112-finalize.yml
          git commit -m 'chore: finalize package propagation fix'
          git push origin HEAD:fix/112-automatic-package-propagation
